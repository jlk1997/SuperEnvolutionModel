# Same census as evolve_census.yaml, without the hand-written night curriculum.
# Run: python -m evo evolve --config configs/evolve_census_generic.yaml
run_name: evolve_census_generic
station: live
model_name: e:/envolution/models/Qwen2.5-1.5B-Instruct
seed: 0
seeds: [0, 1, 2]
days: 10
census: true
census_every: 5
census_sample: 4
census_turns: 1
exam_mix: true
compose: true
hindsight: true
retention_gate: true
chain_exam: true
chain_repeat: 2
hand_curriculum: false
exam_pool: 12
held_exam_cap: 32
new_tools_per_day: 2
practice_tasks: 2
gate_tasks: 1
exam_tasks: 6
tune_tasks: 2
max_turns: 2
night_steps: 12
night_epochs: 2
inner_lr: 0.0005
outer_lr: 0.0005
max_seq_len: 384
kl_coef: 0.5
max_new_code: 80
edit_tokens: 64
answer_tokens: 8
exec_timeout: 2.0
lora_rank: 8
lora_alpha: 16
max_f1_drop: 0.15
gate_drop: 0.34
measure_consistency: false
write_decision: false
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
