# Single-passage SEAL comparison on the laptop GPU.
# Primary metric is mean no-context F1. EM is reported alongside it.
model_name: e:/envolution/models/Qwen2.5-1.5B-Instruct
seed: 0
lora_rank: 8
lora_alpha: 16
max_seq_len: 384
max_passage_chars: 1600
candidate_pool: 16
n_train: 2
n_test: 2
questions_per_passage: 3
n_edits: 2
edit_tokens: 96
answer_tokens: 16
inner_steps: 8
inner_lr: 0.0001
outer_lr: 0.00005
outer_epochs: 2
outer_iters: 1
temperature: 0.7
reward_metric: f1
reward_threshold: 0.0
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
