# Round 3 knowledge update.
# Same anchor and peak gate as phase1_evolve, plus a replay of every edit
# that has already been merged. The new passage is learned while the old
# edits are trained again in the same inner step.
run_name: phase1_replay
model_name: e:/envolution/models/Qwen2.5-1.5B-Instruct
seed: 0
lora_rank: 8
lora_alpha: 16
max_seq_len: 384
max_passage_chars: 1600
candidate_pool: 16
n_passages: 4
questions_per_passage: 3
n_edits: 2
edit_tokens: 96
answer_tokens: 16
inner_steps: 40
inner_lr: 0.0005
temperature: 0.7
reward_metric: f1
lam: 1.0
max_f1_drop: 0.15
max_kl: 16.0
kl_coef: 0.5
distill_questions: 2
replay_coef: 0.5
methods:
  - replay
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
