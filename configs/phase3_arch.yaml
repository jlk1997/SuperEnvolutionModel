# From-scratch comparison. Self-modifying model is sized near 20M parameters.
# The transformer MLP width is chosen so its parameter count matches.
seed: 0
d_model: 768
n_layers: 6
n_heads: 12
d_mem: 128
seq_len: 64
batch_size: 4
steps_per_domain: 80
arch_lr: 0.0003
log_every: 20
grad_clip: 1.0
freqs:
  - 1
  - 4
  - 16
etas:
  - 0.30
  - 0.10
  - 0.02
decays:
  - 0.60
  - 0.90
  - 0.99
bptt: 64
