# Round 3 architecture update.
# Fast weights survive from one forward to the next inside a domain.
# They reset when the domain changes. After domain B, domain A is reread
# in order with no optimizer step.
run_name: phase3_carry
seed: 0
carry_only: true
carry_state: true
d_model: 768
n_layers: 6
n_heads: 12
d_mem: 128
seq_len: 64
batch_size: 4
steps_per_domain: 80
arch_lr: 0.0003
log_every: 20
grad_clip: 1.0
freqs:
  - 1
  - 4
  - 16
etas:
  - 0.30
  - 0.10
  - 0.02
decays:
  - 0.60
  - 0.90
  - 0.99
bptt: 64
