# Closing exam for this phase. 1.5B, five days.
# Each morning scores one held-out chain and one older single call.
# Nights train verified chains per tool kind, on arguments the exam never uses.
# Run: python -m evo exam
# Faster gate before this: python -m evo exam --check
# Two-day 0.5B check: python -m evo live --config configs/phase4_chain.yaml
run_name: phase4_exam
station: live
model_name: e:/envolution/models/Qwen2.5-1.5B-Instruct
seed: 0
days: 5
compose: true
hindsight: true
retention_gate: true
chain_exam: true
chain_repeat: 2
new_tools_per_day: 2
practice_tasks: 2
gate_tasks: 1
exam_tasks: 2
tune_tasks: 2
max_turns: 2
night_steps: 12
night_epochs: 2
inner_lr: 0.0005
outer_lr: 0.0005
max_seq_len: 384
kl_coef: 0.5
max_new_code: 80
edit_tokens: 64
answer_tokens: 8
exec_timeout: 2.0
lora_rank: 8
lora_alpha: 16
max_f1_drop: 0.15
gate_drop: 0.34
measure_consistency: false
write_decision: false
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
