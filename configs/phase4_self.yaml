# Two 0.5B runs: a fixed nightly schedule, then the model's own rules.
run_name: phase4_self
station: self
model_name: e:/envolution/models/Qwen2.5-0.5B-Instruct
seed: 1
days: 2
new_tools_schedule:
  - 2
  - 0
practice_tasks: 2
gate_tasks: 1
exam_tasks: 2
tune_tasks: 4
max_turns: 2
night_steps: 8
night_epochs: 1
inner_lr: 0.0005
outer_lr: 0.0005
max_seq_len: 384
kl_coef: 0.5
max_new_code: 64
edit_tokens: 48
answer_tokens: 8
exec_timeout: 2.0
lora_rank: 8
lora_alpha: 16
max_f1_drop: 0.15
gate_drop: 0.34
min_learnability: 0.34
measure_consistency: true
write_decision: false
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
