# Three seeds, six arms, equal step budget. 0.5B so the paper finishes on this laptop.
# A 1.5B rerun is the confirmation, not this first gate.
run_name: stream_census
model_name: e:/envolution/models/Qwen2.5-0.5B-Instruct
seed: 0
seeds: [0, 1, 2]
ticks: 6
day_ticks: 3
tool_every: 3
drift_tick: 2
new_tools_per_day: 2
exam_tasks: 4
practice_tasks: 1
gate_tasks: 1
max_turns: 1
max_opt_steps: 48
txn_steps: 4
grpo_k: 2
canary_size: 1
flush_limit: 2
temperature: 0.7
fast_scale: 0.02
write_gate: true
inner_lr: 0.0005
outer_lr: 0.0005
max_seq_len: 256
max_new_code: 64
exec_timeout: 2.0
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
gate_drop: 0.34
arms: [agent, oracle, shift, continual, continual_nofast, continual_sft]
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- A-4 power (see docs/POWER_ANALYSIS.md) ---
# First stream paper is exploratory on 0.5B; confirm on 1.5B with larger n.
power_target: 0.8
power_p_new: 0.55
power_p_base: 0.45
power_min_n: 24
power_required_n: 200
model_name_confirm: e:/envolution/models/Qwen2.5-1.5B-Instruct
